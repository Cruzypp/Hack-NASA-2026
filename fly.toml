# Backend (onboard node) on Fly.io. Rename `app`, then: fly launch --no-deploy && fly volumes create astra_data --size 1 && fly deploy
app = "astra-health-demo"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  # Set both to your Vercel URL.
  ASTRA_PUBLIC_URL = "https://astra-health-demo.vercel.app"
  ASTRA_CORS = "https://astra-health-demo.vercel.app"

[mounts]
  source = "astra_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # One always-on machine: WebSockets stay connected and SQLite has a single writer.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
